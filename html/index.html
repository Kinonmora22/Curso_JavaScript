<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios HTML</title>
</head>

<body>
    <header>
        <h1>Exercícios HTML</h1>
    </header>
    <nav>
        <a href wm-nav="exercicios/teste.html">00 - Teste</a> |
        <a href wm-nav="exercicios/texto1.html">01 - Texto 1</a> |
        <a href wm-nav="exercicios/texto2.html">02 - Texto 2</a> |
        <a href wm-nav="exercicios/listas.html">03 - Listas</a> |
        <a href wm-nav="exercicios/listaAninhada.html">04 - Lista Aninhada</a> |
        <a href wm-nav="exercicios/links.html">05 - Links</a> |
        <a href wm-nav="exercicios/tabela.html">06 - Tabela</a> |
        <a href wm-nav="exercicios/form/form.html">07 - Formulário</a>|
        <a href wm-nav="exercicios/imagens.html">08 - Imagens</a>|
        <a href wm-nav="exercicios/video.html">09 - Vídeos</a>|
        <a href wm-nav="exercicios/slider.html">10 - Slider</a>|
    </nav>

    <section id="conteudo"></section>

    <footer>
        <br>
        Curso de Web Moderno
    </footer>

    <script>

        document.querySelectorAll('[wm-nav]').forEach(link => {
            link.onclick = function (e) {
                e.preventDefault()
                const conteudo = document.getElementById('conteudo')
                const url = link.getAttribute('wm-nav')

                fetch(url)
                    .then(resp => resp.text())
                    .then(html => {
                        conteudo.innerHTML = html

                        // Inicializa as funções dependendo da página que foi carregada
                        // Lógica para Tabela
                        inicializarTabela()
                        // Lógica para Lista Aninhada (wm-folder)
                        inicializarArvore()
                        // Lógica para o Carrossel manual (Se for a página de imagens)
                        if (url.includes('imagens.html')) {
                            inicializarSlider()
                        }
                        // Lógica para o Slider automático (a nossa animação com mover/exibirSlide)
                        if (url.includes('slider.html')) {
                            inicializarSliderAuto()
                        }
                        if (url.includes('video.html')) {
                            inicializarVideo()
                        }
                    })
            }
        })

        // ==========================================
        // FUNÇÃO PARA A LISTA ANINHADA (ÁRVORE)
        // ==========================================
        function inicializarArvore() {
            const conteudo = document.getElementById('conteudo')
            const folders = conteudo.querySelectorAll('[wm-folder]')

            if (!folders.length) return

            folders.forEach(folder => {
                folder.onclick = function (e) {
                    e.preventDefault()
                    const ul = folder.nextElementSibling
                    const currentDisplay = window.getComputedStyle(ul).display
                    ul.style.display = currentDisplay === 'none' ? 'block' : 'none'
                }
            })
        }

        // ==========================================
        // FUNÇÃO DO CARROSSEL MANUAL (IMAGENS - com botões)
        // ==========================================
        function inicializarSlider() {
            const conteudo = document.getElementById('conteudo');

            let paragrafos = conteudo.querySelectorAll("div.a > p"); // filho direto

            if (paragrafos.length === 0) return;

            let indexAtual = 0;

            paragrafos.forEach(p => p.classList.remove("active"));
            paragrafos[indexAtual].classList.add("active");

            const indicador = conteudo.querySelector("#indicador"); // ← busca o indicador

            function atualizarIndicador() {
                if (indicador) indicador.textContent = `Slide ${indexAtual + 1} de ${paragrafos.length}`;
            }

            atualizarIndicador(); // inicializa

            function mudarSlide(direcao) {
                paragrafos[indexAtual].classList.remove("active");
                indexAtual = (indexAtual + direcao + paragrafos.length) % paragrafos.length;
                paragrafos[indexAtual].classList.add("active");
                atualizarIndicador(); // ← atualiza o indicador
            }

            let btnAnterior = conteudo.querySelector("#btn-anterior");
            let btnProximo = conteudo.querySelector("#btn-proximo");

            if (btnAnterior && btnProximo) {
                btnAnterior.onclick = () => mudarSlide(-1);
                btnProximo.onclick = () => mudarSlide(1);
            }
        }

        // ==========================================
        // FUNÇÃO DO SLIDER AUTOMÁTICO (mover / exibirSlide)
        // ==========================================
        function inicializarSliderAuto() {
            const conteudo = document.getElementById('conteudo')
            const container = conteudo.querySelector('[wm-slider]')

            if (!container) return

            const elementos = container.querySelectorAll(':scope > p')
            const slides = Array.from(elementos)

            if (!slides.length) return

            function mover(elem, inicio, fim, passo, callback) {
                const novoInicio = inicio - passo
                if (novoInicio >= fim) {
                    elem.style.left = novoInicio + 'px'
                    setTimeout(() => mover(elem, novoInicio, fim, passo, callback), 7)
                } else {
                    callback()
                }
            }

            function exibirSlide(slide) {
                slide.style.display = 'block'
                const inicio = container.clientWidth
                const fim = -slide.clientWidth
                slide.style.left = `${inicio}px`
                mover(slide, inicio, fim, 5, () => {
                    slide.style.display = 'none'
                    exibirSlide(getProximo(slide))
                })
            }

            function getProximo(atual) {
                const i = slides.indexOf(atual) + 1
                return i < slides.length ? slides[i] : slides[0]
            }

            exibirSlide(slides[0])
        }
        // ==========================================
        // FUNÇÃO PARA O VÍDEO (com mecânica do personagem)
        // ==========================================
        function inicializarVideo() {
            const conteudo = document.getElementById('conteudo')
            const video = conteudo.querySelector('#meuVideo')
            const personagem = conteudo.querySelector('#personagem')

            if (!video) return

            // Desativa o menu de contexto
            video.oncontextmenu = () => false

            // Botões de Play e Pause
            const btnPlay = conteudo.querySelector('[wm-play]')
            if (btnPlay) {
                btnPlay.onclick = () => video.play()
            }

            const btnPause = conteudo.querySelector('[wm-pause]')
            if (btnPause) {
                btnPause.onclick = () => video.pause()
            }

            // --- TROCA DE ANIMAÇÃO DO PERSONAGEM ---
            video.onplay = () => {
                if (personagem) personagem.src = 'videos/andando.gif'
            }

            video.onpause = () => {
                if (personagem) personagem.src = 'videos/parado.png'
            }

            video.onended = () => {
                if (personagem) personagem.src = 'videos/parado.png'
            }

            // --- MOVIMENTAÇÃO DA BARRA E DO PERSONAGEM ---
            const progressoDiv = conteudo.querySelector('[wm-progresso] > div')

            video.ontimeupdate = () => {
                if (!video.duration) return

                const percentual = (video.currentTime / video.duration) * 100

                // Atualiza a barra de progresso
                if (progressoDiv) {
                    progressoDiv.style.width = `${percentual}%`
                    progressoDiv.innerHTML = `<span>${Math.floor(percentual)}%</span>`
                }

                // Atualiza a posição do personagem ao longo da barra
                if (personagem) {
                    personagem.style.left = `${percentual}%`
                }
            }
        }
        // ==========================================
        // FUNÇÃO DA TABELA (Seu código original)
        // ==========================================
        function inicializarTabela() {
            const conteudo = document.getElementById('conteudo')
            const linhas = conteudo.querySelectorAll('tbody tr')
            if (!linhas.length) return

            let somaTotal = 0

            linhas.forEach((linha) => {
                let precoTexto = linha.querySelector('.preco').textContent
                precoTexto = precoTexto
                    .replace(/R\$\s*/g, '')
                    .replace(/\./g, '')
                    .replace(',', '.')
                    .trim()

                const preco = Number(precoTexto)
                linha.querySelector('.preco').dataset.valor = preco
                linha.querySelector('.preco').textContent =
                    preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })

                const quantidade = Number(linha.querySelector('.quantidade').textContent.trim())
                const total = preco * quantidade

                linha.querySelector('.total').textContent =
                    total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })

                somaTotal += total
            })

            const totalFinalEl = conteudo.querySelector('#totalFinal');
            if (totalFinalEl) {
                totalFinalEl.textContent = somaTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
            }

            conteudo.querySelectorAll('.copiavel').forEach(celula => {
                celula.addEventListener('click', () => {
                    const texto = celula.firstChild?.nodeValue?.trim() ?? celula.textContent.trim()
                    navigator.clipboard.writeText(texto)

                    const avisoAntigo = celula.querySelector('.aviso-copiado')
                    if (avisoAntigo) avisoAntigo.remove()

                    const aviso = document.createElement('span')
                    aviso.textContent = 'Copiado!'
                    aviso.classList.add('aviso-copiado')
                    celula.appendChild(aviso)

                    setTimeout(() => aviso.remove(), 700)
                })
            })

            const botaoToggle = conteudo.querySelector('#toggleCopiarLinhas')
            if (!botaoToggle) return

            let modoCopiarLinhas = false

            let botaoTudo = conteudo.querySelector('.botao-copiar-tudo')
            if (!botaoTudo) {
                const thBotao = conteudo.querySelector('.th-botao');
                if (thBotao) {
                    botaoTudo = document.createElement('button')
                    botaoTudo.classList.add('botao-copiar-tudo')

                    botaoTudo.addEventListener('click', () => {
                        let textoFinal = ''
                        linhas.forEach(l => {
                            const prod = l.children[0].textContent.trim()
                            const prc = l.children[1].textContent.trim()
                            const qtd = l.children[2].textContent.trim()
                            const ttl = l.children[3].textContent.trim()
                            textoFinal += `Produto: ${prod}\nPreço: ${prc}\nQuantidade: ${qtd}\nTotal: ${ttl}\n\n`
                        })
                        textoFinal += `Total Final: ${conteudo.querySelector('#totalFinal').textContent.trim()}`
                        navigator.clipboard.writeText(textoFinal)

                        botaoTudo.innerHTML = '✔'
                        botaoTudo.classList.add('copiado')

                        setTimeout(() => {
                            botaoTudo.innerHTML = ''
                            botaoTudo.classList.remove('copiado')
                        }, 700)
                    })
                    thBotao.appendChild(botaoTudo)
                }
            }

            linhas.forEach((linha) => {
                let botao = linha.querySelector('.botao-copiar-linha')
                if (!botao) {
                    const tdBotao = linha.querySelector('.td-botao');
                    if (tdBotao) {
                        botao = document.createElement('button')
                        botao.classList.add('botao-copiar-linha')

                        botao.addEventListener('click', () => {
                            const produto = linha.children[0].textContent.trim()
                            const preco = linha.children[1].textContent.trim()
                            const quantidade = linha.children[2].textContent.trim()
                            const total = linha.children[3].textContent.trim()
                            const texto = `Produto: ${produto}\nPreço: ${preco}\nQuantidade: ${quantidade}\nTotal: ${total}`

                            navigator.clipboard.writeText(texto)
                            botao.innerHTML = '✔'
                            botao.classList.add('copiado')

                            setTimeout(() => {
                                botao.innerHTML = ''
                                botao.classList.remove('copiado')
                            }, 700)
                        })
                        tdBotao.appendChild(botao)
                    }
                }
            })

            botaoToggle.addEventListener('click', () => {
                modoCopiarLinhas = !modoCopiarLinhas
                if (!botaoTudo) return;

                if (modoCopiarLinhas) {
                    botaoTudo.style.transitionDelay = '0s'
                    botaoTudo.classList.add('visivel')
                } else {
                    botaoTudo.style.transitionDelay = '0s'
                    botaoTudo.classList.remove('visivel')
                }

                linhas.forEach((linha, index) => {
                    const botao = linha.querySelector('.botao-copiar-linha')
                    if (!botao) return

                    clearTimeout(botao._timeoutDelay)

                    if (modoCopiarLinhas) {
                        botao.style.transitionDelay = `${index * 0.08}s`
                        botao.classList.add('visivel')

                        botao._timeoutDelay = setTimeout(() => {
                            botao.style.transitionDelay = '0s'
                        }, (index * 0.08 + 0.2) * 1000)

                    } else {
                        const delaySair = (linhas.length - 1 - index) * 0.03
                        botao.style.transitionDelay = `${delaySair}s`
                        botao.classList.remove('visivel')
                    }
                })
            })
        }
    </script>
</body>

</html>
