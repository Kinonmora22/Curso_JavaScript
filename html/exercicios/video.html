<body>
    <br>

    <div class="player">

        <video id="meuVideo" width="960" height="540">
            <source
                src="videos/The Most Beautifully Animated Magic Spell You'll Ever See  Witch Hat Atelier - Crunchyroll (1080p, h264).mp4"
                type="video/mp4">
            Seu browser não suporta o tipo de arquivo MP4.
        </video>

        <div class="indicador-play-pause" id="indicadorPlayPause">
            ▶
        </div>

        <div class="controles-container">

            <button wm-play="meuVideo" class="btn-controle play" title="Play">
                ▶
            </button>

            <div wm-progresso="meuVideo" class="progresso">
                <img id="personagem" src="videos/parado.png" alt="Personagem">
                <div class="barra-vermelha"></div>
            </div>

            <button wm-pause="meuVideo" class="btn-controle pause" title="Tela cheia">
                ⛶
            </button>

        </div>

    </div>

</body>

<style>
    /* PLAYER */
    .player {
        width: 960px;
        margin: 20px auto 0 auto;
        position: relative;
    }

    /* O vídeo agora pertence ao player */
    .player video {
        width: 960px;
        height: 540px;
        margin: 0;
    }

    /* CONTROLES */
    .player .controles-container {
        width: 100%;
        margin: 30px auto 0 auto;
    }


    /* =========================
   TELA CHEIA
   ========================= */

    .player:fullscreen {
        width: 100vw;
        height: 100vh;
        background-color: black;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Vídeo em fullscreen */
    .player:fullscreen video {
        width: 100%;
        height: 100%;
        object-fit: contain;

        border: none;
    }


    /* Controles sobre o vídeo */
    .player:fullscreen .controles-container {
        position: absolute;
        left: 0;
        bottom: 25px;
        width: calc(100% - 50px);
        margin: 0 25px;

        z-index: 20;

        /* Animação do desaparecimento */
        opacity: 1;
        visibility: visible;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .player:fullscreen .controles-container.controles-escondidos {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    /* Esconde o cursor em todo o player */
    .player:fullscreen.cursor-escondido {
        cursor: none;
    }


    /* Botão de fullscreen */
    .player:fullscreen .pause {
        cursor: pointer;
    }

    body {
        background-image: url('https://i.pinimg.com/vwebp/736x/53/5a/a4/535aa4582ee059587423cb585dea9db8.webp');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    video {
        border: solid 6px #300000;
        margin-top: 20px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    /* CONTÊINER DOS CONTROLES */
    .controles-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 960px;
        margin: 30px auto 0 auto;
        gap: 15px;
    }

    /* BOTÕES CIRCULARES */
    .btn-controle {
        user-select: none;
        -webkit-user-select: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-image: url('videos/fundo.jpg');
        border: solid 2px #7a3f3f;
        color: #7a3f3f;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.2s, background-color 0.2s;
    }

    .btn-controle:hover {
        background-color: #ffffff;
        transform: scale(1.1);
    }

    /* BARRA DE PROGRESSO */
    .progresso {
        user-select: none;
        -webkit-user-select: none;
        flex-grow: 1;
        height: 20px;
        border-radius: 10px;
        border: solid 3px #300000;
        position: relative;
        background-image: url('videos/fundo.jpg');
    }

    /* BARRA VERMELHA */
    .progresso>div {
        user-select: none;
        -webkit-user-select: none;
        border-color: rgb(146, 17, 17);
        border-radius: 7px 0px 7px 7px;
        background-color: rgb(146, 17, 17);
        font-family: poppins;
        color: white;
        height: 100%;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        font-size: 12px;
        width: 0%;
        overflow: hidden;
        position: relative;
        z-index: 1;
    }

    /* RECUO DO TEXTO DA PORCENTAGEM */
    .progresso>div>span {
        margin-right: 15px;
        white-space: nowrap;
    }

    /* PERSONAGEM */
    #personagem {
        position: absolute;
        bottom: 0;
        left: 0%;
        height: 40px;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 10;
        display: block;
    }


    /* ==========================================
   INDICADOR PLAY / PAUSE NO CENTRO DO VÍDEO
   ========================================== */

    .indicador-play-pause {
        user-select: none;
        -webkit-user-select: none;
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%) scale(0.7);

        width: 90px;
        height: 90px;

        border-radius: 50%;

        background-color: rgba(0, 0, 0, 0.65);

        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 38px;

        pointer-events: none;

        opacity: 0;

        z-index: 15;

        transition:
            opacity 0.25s ease,
            transform 0.25s ease;
    }


    /* Quando o indicador aparece */

    .indicador-play-pause.mostrar {
        opacity: 1;

        transform:
            translate(-50%, -50%) scale(1);
    }


    /* Pequeno efeito de saída */

    .indicador-play-pause.sumir {
        opacity: 0;

        transform:
            translate(-50%, -50%) scale(1.15);
    }
</style>

<script>
    const video = document.getElementById('meuVideo');
    const player = document.querySelector('.player');
    const controles = document.querySelector('.controles-container');
    const botaoPlay = document.querySelector('.play');
    const botaoFullscreen = document.querySelector('.pause');

    let timerControles;


    // ==========================================
    // PLAY / PAUSE
    // ==========================================

    botaoPlay.addEventListener('click', function () {

        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }

    });


    // ==========================================
    // CLIQUE NO VÍDEO = PLAY / PAUSE
    // ==========================================

    video.addEventListener('click', function () {

        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }

    });

    // Atualiza o ícone do Play/Pause
    video.addEventListener('play', function () {

        botaoPlay.textContent = '❚❚';
        botaoPlay.title = 'Pause';

    });


    video.addEventListener('pause', function () {

        botaoPlay.textContent = '▶';
        botaoPlay.title = 'Play';

    });


    // Se o vídeo terminar
    video.addEventListener('ended', function () {

        botaoPlay.textContent = '▶';
        botaoPlay.title = 'Play';

    });


    // ==========================================
    // TELA CHEIA
    // ==========================================

    botaoFullscreen.addEventListener('click', function () {

        if (!document.fullscreenElement) {

            player.requestFullscreen();

        } else {

            document.exitFullscreen();

        }

    });


    // ==========================================
    // CONTROLES + CURSOR
    // ==========================================

    function mostrarControles() {

        // Só precisamos dessa lógica no fullscreen
        if (document.fullscreenElement !== player) {
            return;
        }

        // Mostra os controles
        controles.classList.remove('controles-escondidos');

        // Mostra o cursor
        player.classList.remove('cursor-escondido');

        // Reinicia o contador
        clearTimeout(timerControles);

        // Começa novamente a contagem dos 5 segundos
        timerControles = setTimeout(function () {

            controles.classList.add('controles-escondidos');
            player.classList.add('cursor-escondido');

        }, 3000);

    }


    // ==========================================
    // MOVIMENTO DO MOUSE
    // ==========================================

    player.addEventListener('mousemove', function () {

        mostrarControles();

    });


    // ==========================================
    // ENTRAR EM FULLSCREEN
    // ==========================================

    document.addEventListener('fullscreenchange', function () {

        if (document.fullscreenElement === player) {

            // Entrou em fullscreen
            mostrarControles();

        } else {

            // Saiu do fullscreen
            clearTimeout(timerControles);

            controles.classList.remove('controles-escondidos');
            player.classList.remove('cursor-escondido');

        }

    });


    // ==========================================
    // MOUSE SOBRE OS CONTROLES
    // ==========================================

    controles.addEventListener('mouseenter', function () {

        clearTimeout(timerControles);

        controles.classList.remove('controles-escondidos');
        player.classList.remove('cursor-escondido');

    });


    controles.addEventListener('mouseleave', function () {

        mostrarControles();

    });




</script>
