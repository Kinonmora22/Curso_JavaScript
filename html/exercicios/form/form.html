<h1>Formulário</h1>

<form action="http://localhost:3030/usuarios" method="POST">
    <input type="hidden" name="id" value="3">
    <input type="text" name="name">
    <input type="password" name="senha">
    <textarea name="bio" cols="30" rows="10"></textarea>
    <div>
        <input type="radio" name="tipo" value="admin">Admin
        <input type="radio" name="tipo" value="regular">Regular
        <input type="radio" name="tipo" value="professor">Professor
    </div>
    <div>
        <input type="checkbox" name="ativo">Ativo
    </div>

    <select name="estado">
        <option value="">Selecione</option>
        <option value="ac">Acre</option>
        <option value="ba">Bahia</option>
        <option value="ce">Ceará</option>
    </select>

    <select name="interesses" multiple size="5">
        <option value="js">Javascript</option>
        <option value="java">Java</option>
        <option value="php">PHP</option>
        <option value="python">Python</option>
        <option value="go">Go</option>
        <option value="c">C</option>
    </select>

    <button formaction="http://localhost:3030/usuarios">Incluir</button>
    <button formaction="http://localhost:3030/usuarios/3">Alterar</button>
    <button>Alterar</button>
</form>

<style>
    input,
    textarea,
    select {
        margin-bottom: 10px;
        display: block;
    }

    div [type=radio],
    div [type=checkbox] {
        display: inline;
    }
</style>
